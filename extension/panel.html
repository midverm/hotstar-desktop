<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hotstar Desktop</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <img src="icons/icon128.png" alt="" width="32" height="32">
    <h1>Hotstar</h1>
  </header>
  <main>
    <div class="control">
      <span id="mode-label">Android mode</span>
      <button id="toggle" type="button" role="switch" aria-labelledby="mode-label" aria-checked="false" disabled>
        <span class="track"><span class="thumb"></span></span>
      </button>
    </div>
    <p id="status" role="status" aria-live="polite">Checking…</p>
    <a id="open" href="https://www.hotstar.com/in/home" target="_blank" rel="noopener" hidden>Open Hotstar ↗</a>
    <p id="error" role="alert" hidden></p>
  </main>
  <script src="panel.js" type="module"></script>
</body>
</html>
